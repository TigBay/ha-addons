---
# ============================================================================
# Obsidian MCP Server – Home Assistant add-on configuration
# Documentation: https://github.com/TigBay/ha-addons/blob/main/obsidian-mcp/DOCS.md
# ============================================================================

name: "Obsidian MCP Server"
description: >-
  Read and write an end-to-end encrypted Obsidian LiveSync vault from an AI
  assistant. Speaks MCP over HTTP and brings its own OAuth 2.1 provider.
slug: "obsidian-mcp"
version: "0.2.0"
url: "https://github.com/TigBay/ha-addons/blob/main/obsidian-mcp/DOCS.md"

# No image key on purpose: the Supervisor builds this add-on locally from the
# Dockerfile. See obsidian-couchdb/config.yaml for the reasoning.

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false
timeout: 20

# The server speaks plain HTTP on 8787, and the bearer token travels in a
# header. 8787 is for tunnel and proxy add-ons on the internal network only and
# is never published on the host: run.sh refuses to start if it is. Devices on
# the LAN connect over HTTPS on 8443 (option ssl, tls-proxy.mjs).
ports:
  8787/tcp: null
  8443/tcp: null
ports_description:
  8787/tcp: "Plain HTTP, internal only. Leave empty: the add-on refuses to start if it is published"
  8443/tcp: "HTTPS MCP endpoint (/mcp) and OAuth discovery (needs the ssl option)"

# The search index and the OAuth tokens live under /data and are therefore part
# of the add-on backup. /ssl holds the certificate for the HTTPS listener.
map:
  - type: ssl
    read_only: true

host_network: false

# Read access to the Supervisor API, so run.sh can check whether 8787 is
# published on the host (GET /addons/self/info).
hassio_api: true

# AppArmor is off until a profile has been tested on real hardware.
apparmor: false
privileged: []
full_access: false

options:
  couchdb_url: "http://local-obsidian-couchdb:5984"
  couchdb_user: "obsidian"
  couchdb_password: ""
  couchdb_database: "obsidian"
  passphrase: ""
  id_derivation_key: ""
  case_sensitive: false
  auth_token: ""
  base_url: ""
  write_folders: ""
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  log_level: "info"

schema:
  couchdb_url: url
  couchdb_user: str
  couchdb_password: password
  couchdb_database: match(^[a-z][a-z0-9_$()+/-]*$)
  passphrase: password?
  id_derivation_key: password?
  case_sensitive: bool
  auth_token: password?
  base_url: str?
  write_folders: str?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(debug|info|warning|error)

panel_icon: "mdi:robot-outline"

# /health answers without a token, unlike /mcp. Verified in the PoC.
# Without host_network the Supervisor probes the container address and the
# container port, so the unpublished 8787 works here. Verified on a Dell Wyse.
watchdog: "http://[HOST]:[PORT:8787]/health"
