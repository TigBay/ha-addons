name: Bug report
description: Report a problem with the SilverBullet add-on
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! Please fill in all relevant fields.

  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      description: Which version of the add-on do you use?
      placeholder: "e.g. 2026.10.0"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.10.4"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens? What should happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the add-on
        2. ...
        3. The problem occurs
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Add-on logs
      description: "Copy the logs from: Settings → Add-ons → SilverBullet → Log. Remove passwords and tokens first."
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read the documentation
          required: true
        - label: I have searched for similar issues
          required: true
