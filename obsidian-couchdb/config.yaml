---
# ============================================================================
# Obsidian LiveSync Server (CouchDB) – Home Assistant add-on configuration
# Documentation: https://github.com/TigBay/ha-addons/blob/main/obsidian-couchdb/DOCS.md
# ============================================================================

name: "Obsidian LiveSync Server"
description: >-
  CouchDB as a sync backend for the Obsidian Self-hosted LiveSync plugin.
  Notes stay end-to-end encrypted; the server never sees plain text.
slug: "obsidian-couchdb"
version: "0.2.1"
url: "https://github.com/TigBay/ha-addons/blob/main/obsidian-couchdb/DOCS.md"

# No image key on purpose: the Supervisor builds this add-on locally from the
# Dockerfile. That keeps it installable by copying the folder to /local_apps, with
# no registry and no CI. A published multi-arch image can follow later.

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false
# CouchDB and the Erlang runtime need longer than the default 10 s to shut down.
timeout: 30

# Plain HTTP on 5984 carries the administrator password in an HTTP Basic
# header. It is for other add-ons on the internal network only and is never
# published on the host: run.sh refuses to start if it is. Devices on the LAN
# connect over HTTPS on 6984 (option ssl).
ports:
  5984/tcp: null
  6984/tcp: null
ports_description:
  5984/tcp: "Plain HTTP, internal only. Leave empty: the add-on refuses to start if it is published"
  6984/tcp: "HTTPS for Obsidian and Fauxton (needs the ssl option)"

# The database lives under /data, so it is part of the add-on backup.
# /ssl holds the certificate for the HTTPS listener. /share is not needed.
map:
  - type: ssl
    read_only: true

host_network: false

# Read access to the Supervisor API, so run.sh can check whether 5984 is
# published on the host (GET /addons/self/info).
hassio_api: true

# AppArmor is off until a profile has been tested on real hardware. CouchDB
# brings a full Erlang runtime; an untested profile breaks the add-on in ways
# that are hard to diagnose. See DOCS.md, "Known limitations".
apparmor: false
privileged: []
full_access: false

options:
  admin_user: "obsidian"
  admin_password: ""
  database: "obsidian"
  cors_origins: "app://obsidian.md,capacitor://localhost,http://localhost"
  cors_headers: ""
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  log_level: "warning"

schema:
  admin_user: str
  admin_password: password
  database: match(^[a-z][a-z0-9_$()+/-]*$)
  cors_origins: str
  cors_headers: str?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(debug|info|notice|warning|error)

# No webui: the Supervisor shows the button even when 6984 has no host port,
# and then links to "https://<host>:None/_utils/". DOCS.md names the address.
panel_icon: "mdi:database-sync-outline"

# The watchdog cannot send credentials. run.sh therefore sets
# "require_valid_user_except_for_up = true": /_up answers without
# authentication, every other path still answers 401. Verified in the PoC.
# Without host_network the Supervisor probes the container address and the
# container port, so the unpublished 5984 works here. Verified on a Dell Wyse.
watchdog: "http://[HOST]:[PORT:5984]/_up"
