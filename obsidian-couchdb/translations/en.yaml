---
configuration:
  admin_user:
    name: Administrator
    description: >-
      CouchDB administrator account. Use the same name in the Obsidian LiveSync
      settings.
  admin_password:
    name: Administrator password
    description: >-
      Required. Without it CouchDB would run in admin party mode, where everyone
      on the network may read and write. The add-on refuses to start without a
      password.
  database:
    name: Database name
    description: >-
      Name of the database holding the vault. Must match the database name in the
      Obsidian LiveSync settings. Lower case, no spaces.
  cors_origins:
    name: Allowed origins (CORS)
    description: >-
      Comma-separated origins Obsidian connects from. The default covers desktop,
      mobile and local browser access. Do not use a wildcard.
  cors_headers:
    name: Extra request headers (CORS)
    description: >-
      Optional, comma-separated header names the client may send in addition to
      the usual ones, for example cf-access-client-id, cf-access-client-secret
      when a proxy checks a token. Leave empty if you do not use one.
  ssl:
    name: HTTPS
    description: >-
      Serve HTTPS on port 6984 with the certificate from /ssl. Needed for
      Obsidian to connect directly; plain HTTP is never offered to the network.
  certfile:
    name: Certificate file
    description: Certificate (PEM, full chain), relative to /ssl.
  keyfile:
    name: Key file
    description: Private key (PEM), relative to /ssl.
  log_level:
    name: Log level
    description: >-
      CouchDB log level. Use warning for everyday operation; debug writes a lot
      and fills the add-on log.
network:
  5984/tcp: >-
    Plain HTTP for other add-ons only. Leave empty: the add-on refuses to start
    if this port is published.
  6984/tcp: HTTPS for Obsidian and Fauxton (needs the HTTPS option)
