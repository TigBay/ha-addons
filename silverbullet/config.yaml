---
# ============================================================================
# SilverBullet Home Assistant Add-on – configuration
# Documentation: https://github.com/TigBay/ha-addons/blob/main/silverbullet/DOCS.md
# ============================================================================

name: "SilverBullet"
description: >-
  Self-hosted Markdown note-taking system and Notion alternative.
  All data stays local as plain-text Markdown files.
slug: "silverbullet"
version: "2026.10.0"
url: "https://github.com/TigBay/ha-addons/blob/main/silverbullet/DOCS.md"

# Docker image (multi-arch manifest, contains amd64 + aarch64)
image: "ghcr.io/tigbay/ha-addons-silverbullet"

# Supported architectures
arch:
  - amd64
  - aarch64

# Startup behavior
startup: application
boot: auto
init: false
# Time for a clean shutdown (default 10 s). A buffer for Chromium and
# SilverBullet before the Supervisor sends SIGKILL.
timeout: 20

# Ports
ports:
  3000/tcp: 3000
  3033/tcp: null
ports_description:
  3000/tcp: "SilverBullet web interface"
  3033/tcp: "MCP bridge (only with enable_mcp: true)"

# Directory access
map:
  - type: share
    read_only: false

# Network
host_network: false

# Security
privileged: []
full_access: false

# Backup: /data (internal add-on configuration) is backed up automatically.
# IMPORTANT: /share/silverbullet/space is part of the full Home Assistant backup.
# For separate backups of the space, read the documentation.

# Default options (written to /data/options.json)
options:
  sb_user: "admin:changeme"
  space_path: "/share/silverbullet/space"
  enable_mcp: false
  mcp_token: ""
  additional_args: ""

# Schema – validation and UI representation
schema:
  sb_user: str
  space_path: str
  enable_mcp: bool
  mcp_token: password?
  additional_args: str?

# Web UI configuration
webui: "http://[HOST]:[PORT:3000]"
panel_icon: "mdi:notebook-edit-outline"
panel_title: "SilverBullet"

# Watchdog (the add-on is restarted when the health check fails)
watchdog: "http://[HOST]:[PORT:3000]/.instance"
